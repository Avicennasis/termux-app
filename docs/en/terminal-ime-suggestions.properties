# Merge these entries into your existing termux.properties; do not replace it.
# Default is false. The IME sees input, including secrets, and the local draft
# can be visible even when a terminal password prompt disables echo.
# No personalized learning is requested, but that is not a privacy guarantee.
# See terminal-ime-suggestions.md before enabling.
# terminal-ime-suggestions = true

# This existing property takes precedence when true. Its default is false.
# enforce-char-based-input = false

# Disable predictions, then run termux-reload-settings:
# terminal-ime-suggestions = false

# No activity/session restart is required; the keyboard connection is restarted.
# Your existing extra-keys, popups, macros, and multi-row toolbar remain available.
